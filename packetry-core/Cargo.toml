
[package]
name = "packetry-core"
version = "0.1.0"
edition = "2024"

[build-dependencies]
built = { version = "0.8.1", features = ["cargo-lock", "git2"] }

[dependencies]
anyhow               = "1"
async-lock           = "3"
arc-swap             = "1.6"
async-trait          = "0.1"
bitfield             = "0.19"
byteorder_slice      = "3.0.0"
bytemuck             = "1.25"
bytemuck_derive      = "1.10"
crc                  = "3.4"
derive_more          = { version = "2.1", features = ["from", "into", "display"] }
futures-channel      = "0.3"
futures-lite         = "2"
futures-util         = "0.3"
hidreport            = "0.6"
hut                  = "0.5"
itertools            = "0.15"
merge                = "0.2.0"
nusb                 = { version = "0.2", features = ["smol"] }
num_enum             = "0.7"
once_cell            = "1"
pcap-file-gsg        = "3.0.0-rc4"
portable_async_sleep = { version = "0.1", default-features = false }
serde                = { version = "1", features = ["derive"] }
serde_json           = { version = "1", optional = true }
usb-ids              = "1.2"

packetry-db             = { path = "../packetry-db" }
